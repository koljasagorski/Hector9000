name: CI

# Tests and checks that need no Raspberry Pi. The older workflow python-app.yml (from upstream)
# is left as it is; this one matches the current code base (Python 3.9 = old Bullseye Pi,
# Python 3.11 = Raspberry Pi OS bookworm of the slim OS).

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (versions as in deploy/requirements-bookworm.txt)
        run: python -m pip install pytest paho-mqtt==1.6.1 webcolors==1.3
      - name: Tests without a broker
        run: >
          python -m pytest -q
          tests/test_Stats.py tests/test_StatsServer.py tests/test_Notifier.py
          tests/test_NotifySettings.py tests/test_Watchdog.py tests/test_ControllerEvents.py
          tests/test_HectorConfig.py tests/test_HectorSystem.py tests/test_DeployLayout.py
      - name: Start a local MQTT broker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          sudo systemctl restart mosquitto
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null && exit 0; sleep 0.5; done
          echo "broker did not come up" >&2; exit 1
      - name: Tests with the broker
        run: >
          python -m pytest -q
          tests/test_HectorController.py tests/test_HectorSimulator.py
          tests/test_database.py tests/test_LEDAnimations.py

  scripts:
    name: Shell scripts, sudoers, web scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in deploy/provision.sh deploy/hector-maint deploy/hector-overlay deploy/hector-kiosk-session \
                   deploy/migrate-data.sh deploy/image/*.sh deploy/image/hector-firstboot deploy/sd-update/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: ShellCheck
        run: |
          shellcheck -S warning -x deploy/provision.sh deploy/hector-maint deploy/hector-overlay \
            deploy/hector-kiosk-session deploy/migrate-data.sh deploy/image/build-image.sh \
            deploy/image/hector-firstboot deploy/sd-update/build-payload.sh \
            deploy/sd-update/mqtt-guard.sh deploy/sd-update/test-mqtt-guard.sh
          # run.sh is the tested updater of the old Pi: only real errors, no style changes
          shellcheck -S warning -e SC2044,SC2155 deploy/sd-update/run.sh
      - name: sudoers syntax
        run: sudo visudo -cf deploy/sudoers.d/hector9000
      - name: JavaScript syntax (dashboard)
        run: |
          for f in Hector9000/web/*.js; do node --check "$f" && echo "ok  $f"; done
