# Hector9000 MQTT broker (installed to /etc/mosquitto/conf.d/hector.conf)
#
# Everything that talks MQTT (server, controller, LED server, stats server and
# the WebUI in the local Chromium) runs on this Raspberry Pi, so the broker only
# listens on the loopback interface. Nobody on the network can trigger
# dosing, reboot or the kiosk exit. The statistics page is a separate HTTP
# service on port 8080 (hector-stats.service) and reachable from the network.
#
# Needs the stock /etc/mosquitto/mosquitto.conf of Debian/Raspberry Pi OS,
# which includes /etc/mosquitto/conf.d/*.conf.

# plain MQTT for the Python services
listener 1883 127.0.0.1
socket_domain ipv4
allow_anonymous true

# MQTT over websocket for the WebUI (js/hector9000.js connects to ws://localhost:9001)
listener 9001 127.0.0.1
socket_domain ipv4
protocol websockets
allow_anonymous true

# all payloads in Hector are tiny; refuse anything big
max_packet_size 65536
