# Hector9000 image: drop-in for the stock userconfig.service (Raspberry Pi OS, package userconf-pi).
#
# Stock behaviour: if the boot partition has no userconf.txt, the service opens an interactive
# "rename user" dialog (whiptail) on VT8 and switches the console to it. It is a oneshot with no
# timeout, so multi-user.target is never reached. On the Hector, a touchscreen without keyboard,
# nobody can answer the dialog and it hides the kiosk on tty1. Found by the QEMU boot test.
#
# Here the service only runs when the user has supplied userconf.txt / userconf (headless method:
# renames the placeholder user "pi" without any dialog). The Raspberry Pi Imager's custom.toml is
# applied by hector-firstboot, which is why the service is ordered after it.
[Unit]
After=hector-firstboot.service
ConditionPathExists=|/boot/firmware/userconf
ConditionPathExists=|/boot/firmware/userconf.txt
